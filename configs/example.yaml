seed: 7
simulation_end_s: 1000

hardware:
  devices:
    - id: 0
      class: compute
      prefill_tokens_per_second: 18000
      decode_tokens_per_second: 2500
      fixed_latency_us: 5
    - id: 1
      class: compute
      prefill_tokens_per_second: 12000
      decode_tokens_per_second: 3000
      fixed_latency_us: 5
  memories:
    - id: 2
      capacity_bytes: 17179869184
      bandwidth_bytes_per_sec: 1.0e10
      fixed_latency_us: 10
    - id: 3
      capacity_bytes: 137438953472
      bandwidth_bytes_per_sec: 2.0e9
      fixed_latency_us: 100
  links:
    - src: 0
      dst: 1
      bandwidth_gbps: 100
      fixed_latency_us: 2
    - src: 1
      dst: 2
      bandwidth_gbps: 100
      fixed_latency_us: 2
    - src: 2
      dst: 0
      bandwidth_gbps: 100
      fixed_latency_us: 2
    - src: 1
      dst: 3
      bandwidth_gbps: 25
      fixed_latency_us: 20
    - src: 3
      dst: 0
      bandwidth_gbps: 25
      fixed_latency_us: 20

workload:
  num_agents: 6000
  arrival:
    type: poisson
    rate_per_second: 0.1
  turns:
    type: discrete
    values: [2, 3]
    probabilities: [0.7, 0.3]
  input_tokens:
    type: bounded_integer
    min: 192
    max: 384
  output_tokens:
    type: bounded_integer
    min: 48
    max: 96
  tool_wait_ms:
    type: lognormal
    mean: 4.0
    sigma: 0.35
    min: 20
    max: 200

invocation_model:
  kv:
    bytes_per_token: 8192
    retention: memory

policy:
  type: static_fcfs
  prefill_device: 0
  decode_device: 1
  memory_resource: 2
  far_memory_resource: 3
