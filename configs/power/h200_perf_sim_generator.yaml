# Generator input: 8 H200 prefill chips + 56 NMP decode nodes (the PanAgretti
# 8/56 split), NMP nodes built from perf_sim's default configuration, Qwen3-235B.
#   python scripts/generate_config.py --input-yaml configs/power/h200_perf_sim_generator.yaml \
#       --routing-traces ../moe_routing --force
model: qwen3-235b

# Prefill: 8 H200 chips as 2 tensor-parallel groups of 4 (Qwen3-235B FP16 ~470 GB
# vs 4 x 141 GB). Per chip 980 TFLOPS (perf_sim H100/GH100 entry) and 4.8 TB/s
# HBM3e, derated 0.65 / 0.75 as in scripts/generate_config_nmp.py.
prefill_device_flops_per_second: 6.37e14
prefill_device_memory_bandwidth_bytes_per_second: 3.6e12
prefill_devices: 2
prefill_tp: 4
prefill_model: roofline_context

# Decode: 56 NMP nodes, attention (DP) and experts (EP) co-located. One node = 4
# unpatched perf_sim stacks (16 ch x 16 banks x 16x16 MACs, 8 tRCD tiers).
# Attention: each session's KV is striped over the node's banks (PanAgretti), so the
# node runs at 4x one stack's measured rate (scripts/power_crosscheck.py --geometry
# perf_sim_default --measure-rates): 69% of peak MACs at 128K context, streaming
# bytes/s harmonic-averaged over the tiers.
# FFN: perf_sim's multi-stack convention, expert tensor parallelism 4 (input
# all-gather included): 7.48e13 MAC/s compute-bound and 79.5 TB/s at batch 1 on
# tier 0 (x 0.836 tier average), about half of perfect 4x scaling.
decode_attn_device_flops_per_second: 3.624e14
decode_attn_device_memory_bandwidth_bytes_per_second: 8.727e13
decode_ffn_device_flops_per_second: 1.4954e14
decode_ffn_device_memory_bandwidth_bytes_per_second: 6.643e13
dp: 56
ep: 56
colocate_attn_ffn: true
attn_proj_reference_batch: 1

# Reference operating point (TraceLab medians: P ~181 new tokens, C ~107-131K).
prefill_tokens: 181
decode_context_tokens: 131072

# 4 x 32 GiB perf_sim stacks minus ~21.5 GB of weights (13.4 GB replicated
# attention + ~8.1 GB, the average node's share of experts; nodes owning 3 of the
# 128 experts hold ~10.6 GB, so their true capacity is ~2.5 GB lower).
attn_kv_capacity_bytes: 1.159e11

# Panel fabric: the GlassML/PanAgretti 16.4 TB/s per node (64 x 2.048 Tb/s; the
# paper's 63 links give 16.1 TB/s), 20 us start. Wang et al. demonstrate 16 Gb/s per
# wavelength (1.024 Tb/s per link); PanAgretti assumes 32 Gb/s.
ffn_all_to_all_bandwidth_bytes_per_second: 1.64e13
ffn_all_to_all_start_latency_us: 20
ffn_all_to_all_min_payload_bytes: 0
kv_p2p_bandwidth_bytes_per_second: 1.64e13
kv_p2p_start_latency_us: 20
kv_pool_bandwidth_bytes_per_second: 6.4e12
kv_pool_start_latency_us: 20

output_dir: configs/power/h200_perf_sim
weight_bytes: 2
activation_bytes: 2
kv_bytes: 2
