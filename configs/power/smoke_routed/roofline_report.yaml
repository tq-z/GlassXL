assumptions:
- Prefill uses compute latency and is calibrated at the supplied P and existing C.
- Supplied FLOP/s and byte/s rates are effective; no hidden efficiency is applied.
- Routing is perfectly balanced; routed activations already include top-k.
- Dense/shared FFN work is ideally EP-sharded; dispatch/combine stays separate.
- Compressed MLA and reference-context amortization of recurrent state are used.
- This is a coarse lower-bound calibration, not a kernel/capacity simulator.
- 'roofline_context prefill: weights read once per batch (routed experts by expected
  uniform-routing coverage), context KV read once per session; latency = max(compute,
  memory).'
- Decode attention charges each session 1/1 of the projection weights (read once per
  device step for a batch of that size).
- 'FFN curves are skew-aware and per device: the simulator''s equal-routing barrier
  returns the sum over MoE layers of the slowest device''s roofline time under real
  decode routing at every batch size (power_model/skew.py).'
